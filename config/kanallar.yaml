# Her kanalın kendi "iş tanımı". İstediğin satırı değiştirebilirsin.
# ses: "kokoro:<ses>" = Kokoro-82M (Apache 2.0, yalnız İngilizce, en kaliteli; liste:
#      https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md) ya da Piper ses modeli
#      (liste: https://huggingface.co/rhasspy/piper-voices). ses_yedek: Kokoro çalışmazsa kullanılacak Piper sesi.
# yayin_saatleri: Türkiye saatiyle; YouTube videoyu bu saatte herkese açar.

kanallar:
  - id: teknoloji_en
    ad: "Tech in 30"                     # YouTube'daki kanal adı (açınca yaz)
    aktif: true
    dil: en
    nis: "AI and technology news explained in 30 seconds, with one honest opinion"
    ses: "kokoro:af_heart"      # Kokoro'nun en yüksek puanlı sesi
    ses_yedek: en_US-ryan-high
    ses_hizi: 1.08
    gunluk_video: 2  # kapasite: tek Google projesi günde ~6 yükleme (10.000 birim / 1.600); toplam 5
    yayin_saatleri: ["17:00", "23:00"]  # ABD sabahı + ABD öğleden sonrası
    gun_yayin_saatleri: {"2026-11-25": ["15:00", "23:00"], "2026-11-26": ["15:00", "17:00", "23:00"]}  # erken paylaşım günleri (kullanıcı isteği)
    saat_dilimi: Europe/Istanbul
    youtube_kategori: 28        # Bilim ve Teknoloji
    kelime_araligi: [65, 100]   # 25-40 sn: tamamlanma oranı için kısa tut
    otomatik_onay: true         # kullanıcı açtı 2026-11-25; yalnız kalite kontrolünden geçen video, geçmeyen masaya
    trend:
      youtube: {bolge: US, kategori: 28}
      google_trends: {bolge: US}
      reddit: [technology, artificial, gadgets, OpenAI]
    formatlar:
      - "news in 3 quick points + my take"
      - "what this means for you"
      - "myth or real?"
      - "the hidden detail nobody talks about"
      - "before vs after"
    senarist_notu: "Explain like to a smart friend. Mention the source name once."
    aciklama_eki: "Follow for daily AI & tech news in 30 seconds."

  - id: finans_tr
    ad: "Cebine Bilgi"
    aktif: false                # 2026-11-25 beklemede (kullanıcı): öncelik Tech in 30 ve Open World Insider
    dil: tr
    nis: "Kişisel finans, para yönetimi ve ekonomi gündemi; sade Türkçe, günlük hayata dönük"
    ses: tr_TR-dfki-medium
    ses_hizi: 1.05
    gunluk_video: 1  # kapasite: tek Google projesi günde ~6 yükleme (10.000 birim / 1.600); toplam 5
    yayin_saatleri: ["20:00"]
    saat_dilimi: Europe/Istanbul
    youtube_kategori: 27        # Eğitim
    kelime_araligi: [60, 105]
    otomatik_onay: true         # kullanıcı açtı 2026-11-25; YouTube bağlanınca devreye girer
    trend:
      youtube: {bolge: TR}
      google_trends: {bolge: TR}
      reddit: [Turkey, PersonalFinance]
    formatlar:
      - "3 maddede para ipucu"
      - "bu haber cebini nasıl etkiler"
      - "yaygın para hatası ve doğrusu"
      - "rakamlarla kısa hesap"
      - "doğru mu yanlış mı"
    senarist_notu: "Yatırım tavsiyesi verme; belirli hisse/coin önermeden genel bilgi ver. Rakam verirsen kaynağını söyle."
    aciklama_eki: "Bu video yatırım tavsiyesi değildir, genel bilgilendirme amaçlıdır."

  - id: gta_en
    ad: "Open World Insider"
    aktif: true
    dil: en
    nis: "GTA news, rumors checked, hidden details and tips, with original commentary"
    ses: "kokoro:am_michael"    # erkek ses, oyun kanalı
    ses_yedek: en_US-ryan-high
    ses_hizi: 1.1
    gunluk_video: 2  # kapasite: tek Google projesi günde ~6 yükleme (10.000 birim / 1.600); toplam 5
    yayin_saatleri: ["19:00", "02:00"]  # Avrupa akşamı + ABD akşamı
    gun_yayin_saatleri: {"2026-11-26": ["02:00", "13:00", "19:00"]}  # erken paylaşım (kullanıcı isteği)
    saat_dilimi: Europe/Istanbul
    youtube_kategori: 20        # Oyun
    kelime_araligi: [60, 95]    # 25-40 sn
    otomatik_onay: true         # kullanıcı açtı 2026-11-25; kampanya klipleri yine masaya düşer
    kaynak_modlari: [haber_yorum, izinli_klip]   # izinli klip yoksa otomatik haber/yorum üretilir
    klip_orani: 0.5             # videoların ~yarısı izinli kampanya klibi (Dom; klip varsa); masada bekler
    resmi_havuz: true           # görseller: Rockstar resmi medyası (gorseller/gta_resmi); Openverse/AI yalnız yedek
    resmi_konu_orani: 0.5       # videoların ~yarısı 'en önemli yerler/karakterler' (kaynak: rockstargames.com/VI)
    hedef_gorsel: 12            # resmi havuzdan farklı görsel sayısı (tekrar olmasın)
    ai_gorsel_adedi: 4          # her videoya yapay zeka ile üretilen 4 sahne
    ai_stil: "open-world crime action game aesthetic, neon sunset city, cinematic, vertical, no logos, no text, original characters"
    yerel_gorsel_adedi: 3       # gorseller/gta_en/ klasörüne kendi koyduğun görsellerden eklenecek sayı
    oyun_kayit_klasoru: klipler/oyun_kayitlari   # kendi GTA kayıtların (.mp4); varsa her sahne buradan gelir
    oyun_sahne_adedi: 16
    trend:
      youtube: {bolge: US, kategori: 20}
      google_trends: {bolge: US}
      reddit: [GTA6, GTA, gtaonline]
    formatlar:
      - "GTA news + my take"
      - "hidden detail you missed"
      - "quick tip that saves you time"
      - "rumor check: real or fake?"
    klip_formatlari:
      - "context of the clip + why it is funny/impressive + what we learn"
      - "breakdown: what the streamer did right"
    senarist_notu: "Do not use in-game radio music. Never claim leaks are confirmed. Credit the streamer by name in permitted clips."

  # GTA'yı Türkçe denemek için: bu kanalı aktif: true yap ve ayrı bir YouTube kanalına bağla.
  - id: gta_tr
    ad: ""
    aktif: false
    dil: tr
    nis: "GTA haberleri, söylenti kontrolü, gizli detaylar ve ipuçları, özgün yorumla"
    ses: tr_TR-dfki-medium
    ses_hizi: 1.08
    gunluk_video: 1
    yayin_saatleri: ["21:00"]
    saat_dilimi: Europe/Istanbul
    youtube_kategori: 20
    kelime_araligi: [55, 100]
    otomatik_onay: false
    kaynak_modlari: [haber_yorum]
    ai_gorsel_adedi: 4
    ai_stil: "open-world crime action game aesthetic, neon sunset city, cinematic, vertical, no logos, no text, original characters"
    yerel_gorsel_adedi: 3
    trend:
      youtube: {bolge: TR, kategori: 20}
      google_trends: {bolge: TR}
      reddit: [GTA6, gtaonline]
    formatlar:
      - "GTA haberi + yorumum"
      - "kaçırdığın gizli detay"
      - "zaman kazandıran ipucu"
      - "söylenti mi gerçek mi"
    klip_formatlari:
      - "klibin bağlamı + neden etkileyici + ne öğreniyoruz"
    senarist_notu: "Oyun içi radyo müziği kullanma. Sızıntıları kesinleşmiş gibi anlatma. İzinli kliplerde yayıncının adını söyle."

  # ---- Çocuk kanalları (YouTube'da "Made for Kids"; hikayeli 2D animasyon, docs/COCUK_KANALLARI.md) ----
  # Karakterler ve mekanlar kodla çizilir (ofis/cocuk). karakterler: tur = tavsan, ayi, kedi, tilki, baykus,
  # kurbaga, sincap, ordek, dino; aksesuar = atki, fiyonk, sapka, gozluk; ses = karakterin sesi; perde = ses inceliği.
  - id: cocuk_en
    ad: "Pip & Pals"                     # öneri; YouTube'da açınca buraya gerçek adı yaz
    tur: cocuk_animasyon
    aktif: true                          # YouTube bağlanana kadar en fazla 3 video hazırda bekler
    cocuklar_icin: true                  # selfDeclaredMadeForKids (COPPA) — çocuk kanalında zorunlu
    google_istemci: client_secret_cocuk.json   # ayrı Google Cloud projesi = ayrı günlük yükleme kotası
    dil: en
    nis: "Short animated bedtime-style stories for ages 3-7 with Pip the bunny and friends; each story teaches one kind lesson"
    ses: "kokoro:af_bella"               # anlatıcı
    ses_yedek: en_US-amy-medium
    ses_hizi: 0.92                       # çocuklar için biraz yavaş
    karakterler:
      - {id: pip, ad: Pip, tur: tavsan, aksesuar: atki, aksesuar_renk: "#4DA3FF", ses: "kokoro:af_sky", perde: 1.18, hiz: 1.0,
         kisilik: "a curious, cheerful little bunny who asks lots of questions"}
      - {id: momo, ad: Momo, tur: ayi, aksesuar: atki, aksesuar_renk: "#E84A5F", ses: "kokoro:am_echo", perde: 1.06, hiz: 0.95,
         kisilik: "a big, gentle bear cub who loves honey and hugs, a bit slow but very kind"}
      - {id: luna, ad: Luna, tur: baykus, aksesuar: gozluk, ses: "kokoro:af_nicole", perde: 1.08, hiz: 0.95,
         kisilik: "a wise, calm owl who helps friends solve problems"}
      - {id: ziggy, ad: Ziggy, tur: tilki, ses: "kokoro:am_puck", perde: 1.15, hiz: 1.05,
         kisilik: "a playful, fast little fox who sometimes rushes and learns to slow down"}
      - {id: bloop, ad: Bloop, tur: kurbaga, aksesuar: sapka, aksesuar_renk: "#FFB020", ses: "kokoro:am_adam", perde: 1.3, hiz: 1.05,
         kisilik: "a silly, funny frog who loves jumping and jokes"}
    gunluk_video: 2
    yayin_saatleri: ["15:00", "23:00"]   # ABD sabahı (8 ET) + okul sonrası (16 ET)
    saat_dilimi: Europe/Istanbul
    youtube_kategori: 1                  # Film & Animasyon
    kelime_araligi: [85, 120]            # ~45-55 sn
    en_fazla_bekleyen: 3
    otomatik_onay: true                  # yalnız kalite + Gemini çocuk denetiminden geçen; geçmeyen masaya
    gemini_onayi_sart: true
    muzik_seviyesi: 0.2
    altyazi: {yazi_tipi: "Comic Sans MS", boyut: 90}
    seo:
      ana_anahtar: ""
      etiketler: ["kids stories", "bedtime stories for kids", "cartoon for kids", "story time", "kids cartoon",
                  "animated stories", "preschool", "moral stories for kids", "toddler stories"]
      hashtagler: ["#kidsstories", "#storytime", "#cartoon"]
    aciklama_eki: "New gentle stories with Pip, Momo, Luna, Ziggy and Bloop every day. Made for kids ages 3-7."

  - id: cocuk_tr
    ad: "Fıstık ve Arkadaşları"          # öneri; YouTube'da açınca buraya gerçek adı yaz
    tur: cocuk_animasyon
    aktif: true
    cocuklar_icin: true
    google_istemci: client_secret_cocuk.json
    dil: tr
    nis: "3-7 yaş için kısa, sıcak, dersli animasyon masalları: Fıstık ve arkadaşları her bölümde bir iyilik öğrenir"
    ses: tr_TR-dfki-medium               # anlatıcı
    ses_hizi: 0.92
    anlatici_perde: 1.0
    karakterler:
      - {id: fistik, ad: Fıstık, tur: sincap, aksesuar: atki, aksesuar_renk: "#2EC4B6", ses: tr_TR-fettah-medium, perde: 1.35, hiz: 1.0,
         kisilik: "meraklı, neşeli, hep soru soran küçük sincap"}
      - {id: pamuk, ad: Pamuk, tur: tavsan, aksesuar: fiyonk, aksesuar_renk: "#FF5C8A", ses: tr_TR-dfki-medium, perde: 1.45, hiz: 1.0,
         kisilik: "nazik, yardımsever, biraz utangaç tavşan"}
      - {id: boncuk, ad: Boncuk, tur: kedi, ses: tr_TR-fahrettin-medium, perde: 1.4, hiz: 1.0,
         kisilik: "oyunbaz, aceleci ama tatlı kedi"}
      - {id: bilge, ad: Bilge, tur: baykus, aksesuar: gozluk, ses: tr_TR-fettah-medium, perde: 1.1, hiz: 0.95,
         kisilik: "sakin, akıllı, sorunları çözen baykuş"}
      - {id: zipzip, ad: Zıpzıp, tur: kurbaga, aksesuar: sapka, aksesuar_renk: "#FFB020", ses: tr_TR-fahrettin-medium, perde: 1.25, hiz: 1.05,
         kisilik: "komik, zıplamayı ve şakaları seven kurbağa"}
    gunluk_video: 2
    yayin_saatleri: ["16:00", "19:30"]   # okul çıkışı + akşam yemeği sonrası
    saat_dilimi: Europe/Istanbul
    youtube_kategori: 1
    kelime_araligi: [80, 110]            # Türkçe kelimeler uzun: ~45-55 sn
    en_fazla_bekleyen: 3
    otomatik_onay: true
    gemini_onayi_sart: true
    muzik_seviyesi: 0.2
    altyazi: {yazi_tipi: "Comic Sans MS", boyut: 88}
    seo:
      ana_anahtar: ""
      etiketler: ["çocuk masalları", "masal dinle", "çizgi film", "uyku masalı", "okul öncesi", "çocuklar için hikaye",
                  "eğitici çizgi film", "değerler eğitimi", "masal"]
      hashtagler: ["#masal", "#çizgifilm", "#çocuk"]
    aciklama_eki: "Fıstık, Pamuk, Boncuk, Bilge ve Zıpzıp ile her gün yeni bir masal. 3-7 yaş çocuklar için."
