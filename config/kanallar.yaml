# Her kanalın kendi "iş tanımı". İstediğin satırı değiştirebilirsin.
# ses: "kokoro:<ses>" = Kokoro-82M (Apache 2.0, yalnız İngilizce, en kaliteli; liste:
#      https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md) ya da Piper ses modeli
#      (liste: https://huggingface.co/rhasspy/piper-voices). ses_yedek: Kokoro çalışmazsa kullanılacak Piper sesi.
# yayin_saatleri: Türkiye saatiyle; YouTube videoyu bu saatte herkese açar.

kanallar:
  - id: teknoloji_en
    ad: "Tech in 30"                     # YouTube'daki kanal adı (açınca yaz)
    aktif: true
    dil: en
    nis: "AI and technology news explained in 30 seconds, with one honest opinion"
    ses: "kokoro:af_heart"      # Kokoro'nun en yüksek puanlı sesi
    ses_yedek: en_US-ryan-high
    ses_hizi: 1.08
    gunluk_video: 2  # kapasite: tek Google projesi günde ~6 yükleme (10.000 birim / 1.600); toplam 5
    yayin_saatleri: ["17:00", "23:00"]  # ABD sabahı + ABD öğleden sonrası
    gun_yayin_saatleri: {"2026-11-25": ["15:00", "23:00"]}  # bugün erken paylaşım (kullanıcı isteği)
    saat_dilimi: Europe/Istanbul
    youtube_kategori: 28        # Bilim ve Teknoloji
    kelime_araligi: [65, 100]   # 25-40 sn: tamamlanma oranı için kısa tut
    otomatik_onay: true         # kullanıcı açtı 2026-11-25; yalnız kalite kontrolünden geçen video, geçmeyen masaya
    trend:
      youtube: {bolge: US, kategori: 28}
      google_trends: {bolge: US}
      reddit: [technology, artificial, gadgets, OpenAI]
    formatlar:
      - "news in 3 quick points + my take"
      - "what this means for you"
      - "myth or real?"
      - "the hidden detail nobody talks about"
      - "before vs after"
    senarist_notu: "Explain like to a smart friend. Mention the source name once."
    aciklama_eki: "Follow for daily AI & tech news in 30 seconds."

  - id: finans_tr
    ad: "Cebine Bilgi"
    aktif: false                # 2026-11-25 beklemede (kullanıcı): öncelik Tech in 30 ve Open World Insider
    dil: tr
    nis: "Kişisel finans, para yönetimi ve ekonomi gündemi; sade Türkçe, günlük hayata dönük"
    ses: tr_TR-dfki-medium
    ses_hizi: 1.05
    gunluk_video: 1  # kapasite: tek Google projesi günde ~6 yükleme (10.000 birim / 1.600); toplam 5
    yayin_saatleri: ["20:00"]
    saat_dilimi: Europe/Istanbul
    youtube_kategori: 27        # Eğitim
    kelime_araligi: [60, 105]
    otomatik_onay: true         # kullanıcı açtı 2026-11-25; YouTube bağlanınca devreye girer
    trend:
      youtube: {bolge: TR}
      google_trends: {bolge: TR}
      reddit: [Turkey, PersonalFinance]
    formatlar:
      - "3 maddede para ipucu"
      - "bu haber cebini nasıl etkiler"
      - "yaygın para hatası ve doğrusu"
      - "rakamlarla kısa hesap"
      - "doğru mu yanlış mı"
    senarist_notu: "Yatırım tavsiyesi verme; belirli hisse/coin önermeden genel bilgi ver. Rakam verirsen kaynağını söyle."
    aciklama_eki: "Bu video yatırım tavsiyesi değildir, genel bilgilendirme amaçlıdır."

  - id: gta_en
    ad: "Open World Insider"
    aktif: true
    dil: en
    nis: "GTA news, rumors checked, hidden details and tips, with original commentary"
    ses: "kokoro:am_michael"    # erkek ses, oyun kanalı
    ses_yedek: en_US-ryan-high
    ses_hizi: 1.1
    gunluk_video: 2  # kapasite: tek Google projesi günde ~6 yükleme (10.000 birim / 1.600); toplam 5
    yayin_saatleri: ["19:00", "02:00"]  # Avrupa akşamı + ABD akşamı
    saat_dilimi: Europe/Istanbul
    youtube_kategori: 20        # Oyun
    kelime_araligi: [60, 95]    # 25-40 sn
    otomatik_onay: true         # kullanıcı açtı 2026-11-25; kampanya klipleri yine masaya düşer
    kaynak_modlari: [haber_yorum, izinli_klip]   # izinli klip yoksa otomatik haber/yorum üretilir
    klip_orani: 0.3             # videoların ~%30'u izinli kampanya klibi (klip varsa); gerisi haber/yorum
    resmi_havuz: true           # görseller: Rockstar resmi medyası (gorseller/gta_resmi); Openverse/AI yalnız yedek
    resmi_konu_orani: 0.5       # videoların ~yarısı 'en önemli yerler/karakterler' (kaynak: rockstargames.com/VI)
    hedef_gorsel: 7
    ai_gorsel_adedi: 4          # her videoya yapay zeka ile üretilen 4 sahne
    ai_stil: "open-world crime action game aesthetic, neon sunset city, cinematic, vertical, no logos, no text, original characters"
    yerel_gorsel_adedi: 3       # gorseller/gta_en/ klasörüne kendi koyduğun görsellerden eklenecek sayı
    oyun_kayit_klasoru: klipler/oyun_kayitlari   # kendi GTA kayıtların (.mp4); varsa her sahne buradan gelir
    oyun_sahne_adedi: 16
    trend:
      youtube: {bolge: US, kategori: 20}
      google_trends: {bolge: US}
      reddit: [GTA6, GTA, gtaonline]
    formatlar:
      - "GTA news + my take"
      - "hidden detail you missed"
      - "quick tip that saves you time"
      - "rumor check: real or fake?"
    klip_formatlari:
      - "context of the clip + why it is funny/impressive + what we learn"
      - "breakdown: what the streamer did right"
    senarist_notu: "Do not use in-game radio music. Never claim leaks are confirmed. Credit the streamer by name in permitted clips."

  # GTA'yı Türkçe denemek için: bu kanalı aktif: true yap ve ayrı bir YouTube kanalına bağla.
