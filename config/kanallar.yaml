    kelime_araligi: [55, 100]
    otomatik_onay: false
    kaynak_modlari: [haber_yorum]
    ai_gorsel_adedi: 4
    ai_stil: "open-world crime action game aesthetic, neon sunset city, cinematic, vertical, no logos, no text, original characters"
    yerel_gorsel_adedi: 3
    trend:
      youtube: {bolge: TR, kategori: 20}
      google_trends: {bolge: TR}
      reddit: [GTA6, gtaonline]
    formatlar:
